name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and verify Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t nginx-demo:latest ./app

      - name: Run container smoke test
        run: |
          docker run --rm nginx-demo:latest cat /usr/share/nginx/html/index.html

  lint-yaml:
    name: Validate Kubernetes YAML files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          python -m pip install yamllint

      - name: Lint manifest files
        run: |
          yamllint -d relaxed K8s/*.yml Metrics/*.yml
